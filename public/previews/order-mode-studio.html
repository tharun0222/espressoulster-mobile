      nextState == null ||

#order-studio *{box-sizing:border-box}
#order-studio .studio-stage{height:686px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:17px}
#order-studio .studio-phone{width:min(100%,366px);height:578px;border-radius:30px;padding:25px 20px;background:radial-gradient(ellipse at 100% 12%,#d6e6f1 0,transparent 63%),linear-gradient(155deg,#adc3d4,#bfd3e3 61%,#9ab5ca);color:var(--studio-ink);overflow:hidden}
#order-studio .studio-brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px;letter-spacing:-.4px;min-height:35px;margin-bottom:22px}
#order-studio .brand-art{width:35px;height:35px;background:var(--studio-logo) center/contain no-repeat;flex:none}
#order-studio .greeting{margin:0 0 23px;font-size:18px;font-weight:400;line-height:1.5;letter-spacing:-.35px}
#order-studio .greeting em{display:block;margin-bottom:5px;font:italic 400 28px/1.3 StudioSerif,Georgia,serif}
#order-studio .outlet{display:flex;align-items:center;gap:10px;padding:14px 12px;border:1px solid #ffffffbb;border-radius:19px;background:linear-gradient(140deg,#f4faffbd,#deecf5a6);min-height:65px}
#order-studio .outlet div{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
#order-studio .outlet strong{font-size:13px;font-weight:600}
#order-studio .outlet small{font-size:12px;color:var(--studio-dim)}
#order-studio .outlet svg{width:17px;height:17px;flex:none}
#order-studio .selector{position:relative;height:225px;margin-top:15px;display:flex;align-items:center;justify-content:center;touch-action:pan-y;user-select:none;perspective:750px;isolation:isolate;overflow:clip}
#order-studio .choices{display:flex;align-items:center;gap:10px;width:100%;position:relative}
#order-studio .choice{border:0;background:none;padding:12px 4px;min-height:118px;flex:1;min-width:0;color:var(--studio-dim);font:400 16px/1.25 &#x27;DM Sans&#x27;,Arial,sans-serif;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;position:relative;isolation:isolate;transition:color .35s}
#order-studio .choice[aria-pressed=true]{color:var(--studio-ink);font-weight:700}
#order-studio .word{display:block;position:relative;white-space:nowrap;letter-spacing:-.45px}
#order-studio .art{position:relative;width:82px;height:81px;flex:none;pointer-events:none;opacity:.58;transform:scale(.82);filter:grayscale(.65);transform-origin:50% 80%}
#order-studio .choice[aria-pressed=true] .art{opacity:1;transform:translateY(-4px) scale(1);filter:grayscale(0)}
#order-studio .ceramic{position:absolute;left:14px;top:25px;width:52px;height:43px;border-radius:7px 7px 22px 22px;background:linear-gradient(110deg,#638ca6 0,#d0e2eb 13%,#547e99 32%,#234d6b 63%,#153d59 84%,#6c97ac 100%);box-shadow:inset 0 -4px 8px #102c4344,0 13px 12px -10px #183d5d66}
#order-studio .ceramic::before{content:&#x27;&#x27;;position:absolute;top:-6px;left:0;width:100%;height:13px;border-radius:50%;background:radial-gradient(ellipse,#b47540 0 49%,#e7b97d 53% 59%,#93b6c9 62% 74%,#c6dce6 79%,#4c7792 90%);box-shadow:0 1px 1px #122e4b66}
#order-studio .ceramic::after{content:&#x27;&#x27;;position:absolute;right:-16px;top:5px;width:19px;height:28px;border:5px solid #426d88;border-left-width:3px;border-radius:4px 14px 14px 9px;z-index:-1;box-shadow:inset -1px 0 1px #e2f3ff88,1px 1px 1px #12304a33}
#order-studio .saucer{position:absolute;left:5px;bottom:8px;width:73px;height:13px;border-radius:50%;background:radial-gradient(ellipse at 50% 20%,#93b9ce 0 20%,#345d7b 47%,#a5c3d3 61%,#325771 73%,transparent 78%);box-shadow:0 9px 10px -6px #17384c55}
