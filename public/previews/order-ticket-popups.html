*{box-sizing:border-box}body{margin:0;background:#b6cbdc;color:#19354b;font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button{font:inherit;cursor:pointer;color:inherit}a{color:inherit}main{max-width:430px;margin:auto;padding:22px 20px 28px;min-height:100dvh;background:linear-gradient(155deg,#adc3d6,#d0e1ed)}.brand{font-size:11px;letter-spacing:2px;font-weight:750}h1{font-size:25px;letter-spacing:-.6px;margin:22px 0 7px}.intro{font-size:12px;line-height:1.5;opacity:.72}.current{display:flex;justify-content:space-between;gap:14px;margin:22px 0 14px}.current strong{letter-spacing:.12em}.current span{font-weight:600}.stage{min-height:355px;display:grid;place-items:center;padding:22px 14px;border-radius:24px;background:rgba(30,67,94,.16);border:1px solid #ffffff77}.ticket{--cut:76px;--r:11px;position:relative;width:100%;max-width:310px;min-height:278px;background:linear-gradient(150deg,#eaf4fa,#cadae9);border:1px solid #f8fcffdd;border-radius:17px;color:#19354b;box-shadow:0 13px 25px #31557025;overflow:hidden;mask-image:radial-gradient(circle at 0 var(--cut),transparent var(--r),#000 calc(var(--r) + 1px)),radial-gradient(circle at 100% var(--cut),transparent var(--r),#000 calc(var(--r) + 1px));mask-size:51% 100%;mask-repeat:no-repeat;mask-position:left top,right top;mask-composite:add;animation:appear .3s ease-out}.ticket header{height:76px;padding:18px 22px;border-bottom:1px dashed #6d91aa88;display:flex;align-items:center;justify-content:space-between;gap:12px}.ticket h2{font-size:18px;letter-spacing:-.5px;margin:0}.ticket .ref{display:block;font-size:10px;opacity:.65;margin-top:5px}.ticket .symbol{width:26px;height:31px;border:1px solid #63839a;display:grid;place-items:center;border-radius:3px;font:700 12px ui-monospace,monospace;opacity:.7}.content{padding:18px 22px 0}.meta{display:flex;justify-content:space-between;font-size:10px;margin-bottom:17px}.meta b{font-weight:650}.item{display:flex;justify-content:space-between;gap:10px;border-bottom:1px so </style></head><body><main><div class="brand">ESPRESSOULSTER COFFEE</div><h1>Choose your ticket</h1><p class="intro">20 order-detail popup concepts · Your blue glass theme</p><div class="current"><strong id="num"></strong><span id="name"></span></div><div class="stage" id="stage"></div><div class="nav"><button id="prev" aria-label="Previous ticket">←</button><span id="count"></span><button id="next" aria-label="Next ticket">→</button></div><div class="picker" id="picker"></div><div class="reference" id="reference"></div><p class="caption">Original coded mockups informed by public ticket references.<br>Preview only · Current order design is unchanged.</p><div class="sources"><a href="https://freefrontend.com/css-tickets/" target="_blank" rel="noreferrer">Ticket references</a><a href="https://www.figma.com/community/file/1352953114797125603/receipt-card-ui-kit" target="_blank" rel="noreferrer">Receipt reference</a></div><button class="refs-button" id="refsToggle">View original public examples</button><div class="references-grid" id="refs"></div><div id="board"></div></main><script>
const names=['Classic Tear','Navy Header','Thermal Edge','Side Punch','Double Perforation','Vertical Rail','Printer Slot','Centred Receipt','Frosted Layers','Narrow Receipt','Order-first Stub','Twin Torn Edge','Round Punch','Side Stub','Total First','Ledger Grid','Collection Stub','Stapled Ticket','Binder Receipt','Quiet Ticket'];
let samples=[];fetch('./ticket-public-references.json').then(r=>r.json()).then(data=>{samples=data}).catch(()=>{});
function ticket(n){return '<article class="ticket t'+n+'"><div class="rail">ESPRESSOULSTER · ORDER</div><div class="stub">ESPRESSOULSTER COFFEE</div><div class="slot"></div><div class="staple"></div><header><div><h2>Order details</h2><span class="ref">19112026-001</span></div><span class="symbol" aria-hidden="true">≡</span></header><div class="hero"><span>Total</span><strong>₹1.00</strong></div><div class="content"><div class="meta"><span>19 Nov · 12:57 pm</span><b>Preparing</b></div><div class="item"><div><strong>1 × Latte</strong><small>Take away</small></div><b>₹1.00</b></div><div class="total"><span>Total</span><strong>₹1.00</strong></div><div class="payment"><span>Payment</span><span>Not paid</span></div></div><div class="foot">ESPRESSOULSTER COFFEE</div></article>';}
let selected=0;function show(i){selected=(i+20)%20;document.getElementById('num').textContent=String(selected+1).padStart(2,'0');document.getElementById('name').textContent=names[selected];document.getElementById('count').textContent=(selected+1)+' / 20';document.getElementById('stage').innerHTML=ticket(selected+1);document.querySelectorAll('.picker button').forEach((b,j)=>b.classList.toggle('active',j===selected));document.getElementById('reference').innerHTML='Shape reference: <a href="https://freefrontend.com/css-tickets/" target="_blank" rel="noreferrer">Public ticket collection</a>';}
names.forEach((name,i)=>{const b=document.createElement('button');b.textContent=String(i+1).padStart(2,'0');b.setAttribute('aria-label','Ticket '+b.textContent+' '+name);b.onclick=()=>show(i);document.getElementById('picker').appendChild(b)});document.getElementById('prev').onclick=()=>show(selected-1);document.getElementById('next').onclick=()=>show(selected+1);document.getElementById('refsToggle').onclick=()=>{const r=document.getElementById('refs');r.style.display=r.style.display==='block'?'none':'block';if(!r.innerHTML)r.innerHTML=samples.map((s,i)=>'<figure><img loading="lazy" src="'+s.image+'" alt="'+s.title+'"><figcaption>'+String(i+1).padStart(2,'0')+' · '+s.title+'</figcaption><a href="https://freefrontend.com/css-tickets/" target="_blank" rel="noreferrer">Original reference and attribution</a></figure>').join('');};show(0);
if(new URLSearchParams(location.search).has('board')){document.body.classList.add('board');document.getElementById('board').innerHTML='<div class="board-grid">'+names.map((name,i)=>'<section class="tile"><div class="tile-head"><b>'+String(i+1).padStart(2,'0')+'</b>'+name+'</div>'+ticket(i+1)+'</section>').join('')+'</div>';}
</script></body></html>
