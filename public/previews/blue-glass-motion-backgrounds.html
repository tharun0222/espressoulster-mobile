#cafe-motion-gallery .cafe-motion-phone{width:min(100%,390px);height:718px;margin-inline:auto;position:relative;overflow:hidden;background:#bed3e2;color:var(--cafe-ink);font:400 14px/1.4 Arial,Helvetica,sans-serif;isolation:isolate}
#cafe-motion-gallery canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#cafe-motion-gallery .cafe-preview-content{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;gap:18px;padding:26px 18px 14px;box-sizing:border-box}
#cafe-motion-gallery .cafe-preview-brand{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:600;gap:8px}
#cafe-motion-gallery .cafe-preview-brand&gt;div{display:flex;gap:15px;align-items:center}
#cafe-motion-gallery .cafe-preview-brand svg{width:21px;height:21px}
#cafe-motion-gallery h2{font-size:25px;line-height:1.2;font-weight:600;letter-spacing:-.7px;margin:4px 0 0}
#cafe-motion-gallery .cafe-preview-outlet{display:flex;align-items:center;gap:13px;background:var(--cafe-glass);border:1px solid #ffffffb0;border-radius:20px;padding:13px 15px;backdrop-filter:blur(14px);box-shadow:0 8px 25px #365a7110}
#cafe-motion-gallery .cafe-preview-outlet&gt;svg{width:24px;height:24px;flex-shrink:0}
#cafe-motion-gallery .cafe-preview-outlet&gt;svg:last-child{width:18px;margin-left:auto}
#cafe-motion-gallery .cafe-preview-outlet strong{font-size:14px;display:block;font-weight:600}
#cafe-motion-gallery .cafe-preview-outlet span{font-size:12px;opacity:.8}
#cafe-motion-gallery .cafe-preview-types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#cafe-motion-gallery .cafe-preview-types&gt;span{display:flex;gap:13px;align-items:center;justify-content:center;min-height:43px;background:#edf7ff60;border:1px solid #fff9;border-radius:25px;font-size:12px;font-weight:600;backdrop-filter:blur(9px)}
#cafe-motion-gallery .cafe-preview-types svg{width:21px;height:21px}
#cafe-motion-gallery .cafe-preview-types&gt;span+span{background:#eff8ff9e}
#cafe-motion-gallery .cafe-preview-drink{display:flex;flex-direction:column;align-items:center;flex:1;min-height:260px;gap:11px;justify-content:center}
#cafe-motion-gallery .cafe-preview-cup{width:240px;height:240px;position:relative;background-image:var(--cafe-cup-image);background-size:contain;background-position:center;background-repeat:no-repeat;mask-image:var(--cafe-cup-mask);mask-size:contain;mask-position:center;mask-repeat:no-repeat}
#cafe-motion-gallery .cafe-preview-cup&gt;span{position:absolute;top:52%;left:24%;width:53%;text-align:center;font-size:13px;color:#382619;font-weight:600;transform:perspective(500px) rotateX(-5deg)}
#cafe-motion-gallery .cafe-preview-cup small{display:block;font-size:6px;letter-spacing:2px;margin-top:4px}
#cafe-motion-gallery h3{font-size:19px;line-height:1.2;font-weight:400;letter-spacing:-.4px;margin:0;text-align:center}
#cafe-motion-gallery .cafe-preview-drink-link{display:flex;align-items:center;gap:25px;font-size:12px;padding:10px 20px;border-radius:24px;border:1px solid #fff9;background:#f0f8ff70;backdrop-filter:blur(12px)}
#cafe-motion-gallery .cafe-preview-drink-link svg{width:13px;height:13px}
#cafe-motion-gallery .cafe-preview-search{display:flex;gap:12px;align-items:center;padding:12px 15px;background:#edf7ff77;border:1px solid #ffffffb0;border-radius:28px;font-size:12px;backdrop-filter:blur(15px)}
#cafe-motion-gallery .cafe-preview-search svg{width:17px;height:17px}
#cafe-motion-gallery .cafe-preview-nav{display:grid;grid-template-columns:1fr .9fr 1.3fr 1.3fr 1fr;align-items:center;gap:2px;min-height:60px;padding:4px;background:#eef7ff9e;border:1px solid #fffc;border-radius:32px;backdrop-filter:blur(18px);margin:0 -8px;box-shadow:0 10px 25px #32566b14}
#cafe-motion-gallery .cafe-preview-nav&gt;span{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;font-size:9px;white-space:nowrap;min-height:52px;font-weight:600}
#cafe-motion-gallery .cafe-preview-nav svg{width:22px;height:22px}
#cafe-motion-gallery .cafe-preview-nav .current{background:#9fc7e594;border-radius:27px;color:#194b70}
@media(max-width:350px){#cafe-motion-gallery .cafe-preview-content{padding-inline:13px}#cafe-motion-gallery .cafe-preview-brand{font-size:13px}#cafe-motion-gallery .cafe-preview-nav&gt;span{font-size:8px}#cafe-motion-gallery .cafe-preview-cup{width:220px;height:220px}}
&lt;/style&gt;
&lt;script&gt;
(()=&gt;{
 const root=document.getElementById(&#x27;cafe-motion-gallery&#x27;);
 const template=root.querySelector(&#x27;#cafe-motion-content&#x27;);
 const phones=Array.from(root.querySelectorAll(&#x27;.cafe-motion-phone&#x27;));
 const settings={speed:.65,strength:.65};
 phones.forEach(phone=&gt;phone.appendChild(template.content.cloneNode(true)));
 if(globalThis.lucide)lucide.createIcons();
 if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=&gt;{}});tweak.addSlider(settings,&#x27;speed&#x27;,{label:&#x27;Motion speed&#x27;,min:.3,max:1.2,step:.05});tweak.addSlider(settings,&#x27;strength&#x27;,{label:&#x27;Background intensity&#x27;,min:.25,max:1,step:.05});}
 const reduced=matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;
 const scenes=phones.map(phone=&gt;({phone,canvas:phone.querySelector(&#x27;canvas&#x27;),ctx:phone.querySelector(&#x27;canvas&#x27;).getContext(&#x27;2d&#x27;),n:Number(phone.dataset.scene),w:0,h:0}));
 const rand=n=&gt;{const x=Math.sin(n*127.1+31.7)*43758.5453;return x-Math.floor(x);};
 function glow(c,x,y,r,rgb,opacity){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${rgb},${opacity})`);g.addColorStop(1,`rgba(${rgb},0)`);c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2);}
 function wave(c,w,h,y,amp,phase,fill,frequency=1){c.beginPath();c.moveTo(-10,h+10);c.lineTo(-10,y);for(let x=-10;x&lt;w+12;x+=6)c.lineTo(x,y+Math.sin(x/w*Math.PI*2*frequency+phase)*amp+Math.sin(x/w*Math.PI*3+phase*.4)*amp*.35);c.lineTo(w+12,h+10);c.closePath();c.fillStyle=fill;c.fill();}
 function line(c,w,y,amp,phase,color){c.beginPath();for(let x=-10;x&lt;w+12;x+=5){const py=y+Math.sin(x/w*Math.PI*2+phase)*amp;if(x===-10)c.moveTo(x,py);else c.lineTo(x,py);}c.strokeStyle=color;c.lineWidth=1;c.stroke();}
 function ribbon(c,w,h,t,i){c.beginPath();const x=w*(.06+i*.22);for(let y=-80;y&lt;h+80;y+=10){const px=x+Math.sin(y/h*5+t*.25+i)*45;if(y===-80)c.moveTo(px,y);else c.lineTo(px,y);}c.strokeStyle=`rgba(248,253,255,${.17+i*.018})`;c.lineWidth=30+i*8;c.stroke();}
 function draw(s,t){
  const {ctx:c,w,h,n}=s;const a=settings.strength;
  c.globalAlpha=1;c.globalCompositeOperation=&#x27;source-over&#x27;;
  const base=c.createLinearGradient(0,0,w,h);base.addColorStop(0,&#x27;#abc3d6&#x27;);base.addColorStop(.5,&#x27;#c5d9e7&#x27;);base.addColorStop(1,&#x27;#b8cfe0&#x27;);c.fillStyle=base;c.fillRect(0,0,w,h);
  c.globalAlpha=a;
  if(n===1){for(let i=0;i&lt;4;i++)wave(c,w,h,h*(.53+i*.1),7+i*3,t*.27+i*.8,`rgba(${i%2?&#x27;114,161,190&#x27;:&#x27;239,249,255&#x27;},${.15+i*.05})`);glow(c,w*.8,h*.25,w,&#x27;248,253,255&#x27;,.6);}
  if(n===2){for(let i=0;i&lt;4;i++){const x=w*(.5+Math.sin(t*.12+i*2)*.6),y=h*(.3+Math.cos(t*.09+i)*.4);glow(c,x,y,w*(.8+i*.06),i%2?&#x27;157,204,228&#x27;:&#x27;242,250,255&#x27;,.7);}c.save();c.translate(w*.5,h*.5);c.rotate(Math.sin(t*.05)*.18);glow(c,0,0,w*.9,&#x27;116,155,188&#x27;,.24);c.restore();}
