&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();

    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },

   * @param {string} property

    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply

  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);

  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

  const postToHost = (type, payload) =&gt; {

    }
  };

    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,

      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },

    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {

      throw persistenceError();
    }

    return new Promise((resolve, reject) =&gt; {

  const mockElement = document.getElementById(&quot;codex-connector-mocks&quot;);
  const fileElement = document.getElementById(&quot;codex-preview-files&quot;);
  const connectorGlobals = {};
  if (bindingElement != null || mockElement != null || fileElement != null) {
    const bindings = parse(bindingElement?.textContent ?? &quot;{}&quot;);
    bindingElement?.remove();

    for (const [name, binding] of Object.entries(bindings)) {

    const pending = [bindings];
    while (pending.length) {

      Object.freeze(object);
      for (const child of Object.values(object)) {

    if (mockElement != null) {
      const mocks = Object.entries(parse(mockElement.textContent));
      mockElement.remove();
      for (const [name, value] of mocks) {
        values.set(name, value);
        updates.push({ name, revision: 1, state: &quot;ready&quot;, value: { type: &quot;json&quot;, value } });
      }
    }
    if (fileElement != null) {
      const files = parse(fileElement.textContent);
      fileElement.remove();
      const blobs = new Map();
      const urls = [];
      for (const [name, binding] of Object.entries(bindings)) {
        if (binding.type !== &quot;file&quot; || !hasOwn(files, binding.path)) continue;

        // A persisted pagehide can restore this same document and its subscriptions.

        urls.length = 0;
      });
    }
    if (mockElement != null || fileElement != null) connectorGlobals.visualizationData = { updates };
    connectorGlobals.visualization = {
      get bindings() {
        return bindings;
      },
      /** @param {string} name @param {(value: unknown) =&gt; void} callback */
      onData(name, callback) {
        if (typeof callback !== &quot;function&quot;) {
          throw new TypeError(&quot;onData requires a callback&quot;);
        }
        try {
          callback(values.get(name));
        } catch (error) {

          console.error(&quot;Live visualization data callback failed&quot;, error);
        }
        // A static preview delivers the current value once per subscription.
        return () =&gt; {};
      },
    };
  }
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      ...connectorGlobals,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }

            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }

    const href = link?.getAttribute(&quot;href&quot;);

      return;
    }

        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }

        target == null ||
        globalThis.navigator.userActivation?.isActive !== true

        return;

        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });

#original-presenter-preview .phone{width:min(100%,352px);height:628px;border-radius:28px;position:relative;isolation:isolate;overflow:hidden;background:var(--camera-photo) center/cover;container-type:inline-size}
#original-presenter-preview[data-backdrop=clear] .phone{background:transparent}
#original-presenter-preview header{position:absolute;left:22px;right:18px;top:22px;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:5}
#original-presenter-preview h1{font-size:17px;line-height:1.3;font-weight:500;margin:0;color:#f1faff;text-shadow:0 1px 8px #18394f88}
#original-presenter-preview .icon-button{width:44px;height:44px;border:1px solid #deefff80;border-radius:50%;background:#18374b22;backdrop-filter:blur(10px);color:#effaff;display:grid;place-items:center;padding:0;flex:none;font:500 12px &#x27;DM Sans&#x27;,sans-serif}
#original-presenter-preview .icon-button svg{width:19px!important;height:19px!important}
#original-presenter-preview[data-backdrop=clear] h1{color:light-dark(#284e68,#edf9ff);text-shadow:none}
#original-presenter-preview[data-backdrop=clear] .icon-button{background:transparent;color:light-dark(#284e68,#edf9ff);border-color:light-dark(#87a8bc99,#edfaff88)}
#original-presenter-preview .finder{position:absolute;left:17%;width:66%;aspect-ratio:1;top:22%;border:1px solid #e4f6ffa6;border-radius:27px;pointer-events:none;box-shadow:0 0 0 3px #eef9ff15;z-index:3}
#original-presenter-preview .finder&gt;i{position:absolute;width:30px;height:30px;border:2px solid #eefaff;filter:drop-shadow(0 2px 1px #23465e45)}
#original-presenter-preview .finder&gt;i:nth-child(1){left:-1px;top:-1px;border-right:0;border-bottom:0;border-radius:27px 0 0}
#original-presenter-preview .finder&gt;i:nth-child(2){right:-1px;top:-1px;border-left:0;border-bottom:0;border-radius:0 27px 0 0}
#original-presenter-preview .finder&gt;i:nth-child(3){left:-1px;bottom:-1px;border-right:0;border-top:0;border-radius:0 0 0 27px}
#original-presenter-preview .finder&gt;i:nth-child(4){right:-1px;bottom:-1px;border-left:0;border-top:0;border-radius:0 0 27px}
#original-presenter-preview[data-backdrop=clear] .finder{border-color:light-dark(#6489a1aa,#e4f6ffa6)}
#original-presenter-preview[data-backdrop=clear] .finder&gt;i{border-color:light-dark(#5b839f,#eefaff)}
#original-presenter-preview .scan-window{position:absolute;inset:3px;overflow:hidden;border-radius:24px}
#original-presenter-preview .beam{position:absolute;left:0;top:0;width:100%;height:25%;opacity:0;background:linear-gradient(transparent,#d9f2ff22 90%,#e2f7ff);transform:translateY(-100%)}
#original-presenter-preview .qr-card{position:absolute;top:calc(22% + 39px);left:calc(50% - 62px);width:124px;height:155px;border-radius:8px;border:1px solid #f6fcff;background:linear-gradient(120deg,#f4fbfe,#d9e9f1);box-shadow:0 10px 25px #14374d40;transform:rotate(-5deg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
#original-presenter-preview .qr-card small{font-size:9px;letter-spacing:1px;font-weight:500;color:#3c6077}
#original-presenter-preview .qr-art{width:83px;height:83px;background:var(--sample-qr) center/contain no-repeat;image-rendering:pixelated}
#original-presenter-preview .qr-card strong{font-size:13px;letter-spacing:2px;font-weight:500;color:#234d68}
#original-presenter-preview .presenter{position:absolute;left:0;top:64%;width:100%;height:162px;object-fit:contain;pointer-events:none;z-index:2}
#original-presenter-preview .controls{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:14px;z-index:5}
#original-presenter-preview .phone.is-zoomed .qr-card{transform:rotate(-2deg) scale(1.12)}
#original-presenter-preview .phone.is-lit{filter:brightness(1.09)}
#original-presenter-preview .result{position:absolute;top:59.5%;left:50%;transform:translateX(-50%);border:1px solid #edfaff;background:#e7f4ffed;color:#2a526e;padding:8px 15px;min-height:35px;display:none;border-radius:25px;font-size:13px;z-index:4;white-space:nowrap}
#original-presenter-preview .phone[data-phase=found] .result{display:block}
#original-presenter-preview .success{position:absolute;inset:0;display:none;place-items:center}
#original-presenter-preview .success span{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:#e6f5ff;color:#315e7a;border:1px solid #f2fcff;box-shadow:0 6px 22px #24496055}
#original-presenter-preview .success svg{width:24px!important;height:24px!important}
#original-presenter-preview .phone[data-phase=found] .success{display:grid}
#original-presenter-preview .phone[data-phase=found] .qr-card{filter:blur(2px);opacity:.6}
#original-presenter-preview .closed{position:absolute;inset:0;display:grid;place-items:center;z-index:9;background:#c2d9e366;backdrop-filter:blur(25px)}
#original-presenter-preview .closed[hidden]{display:none}
#original-presenter-preview .play,#original-presenter-preview .reopen{border:1px solid light-dark(#547b9666,#b4d5eb77);color:light-dark(#254e69,#e4f4ff);background:transparent;border-radius:24px;font:500 13px/1.3 &#x27;DM Sans&#x27;,sans-serif;padding:12px 22px;min-height:44px}
#original-presenter-preview .play:disabled{opacity:.65}
#original-presenter-preview .error{max-width:320px;text-align:center;color:light-dark(#9a3943,#f4b8be);font-size:13px;margin:0}
@media(max-width:360px){#original-presenter-preview .phone{height:612px;border-radius:25px}#original-presenter-preview .qr-card{top:calc(22% + 24px);width:116px;height:145px;left:calc(50% - 58px)}#original-presenter-preview .qr-art{width:75px;height:75px}#original-presenter-preview .presenter{top:63.5%;height:155px}}
@media(prefers-reduced-motion:reduce){#original-presenter-preview .beam{display:none}}
