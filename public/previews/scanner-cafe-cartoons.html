&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },

   * @param {object} prototype
   * @param {string} property

    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply

      throw new Error(`Missing ${property} getter`);

  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);

  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;

  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;

  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {

    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,
        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },

    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {

      throw persistenceError();
    }

    return new Promise((resolve, reject) =&gt; {

        reject(persistenceError());

  const bindingElement = document.getElementById(&quot;codex-visualization-bindings&quot;);
  const mockElement = document.getElementById(&quot;codex-connector-mocks&quot;);
  const fileElement = document.getElementById(&quot;codex-preview-files&quot;);
  const connectorGlobals = {};
  if (bindingElement != null || mockElement != null || fileElement != null) {
    const bindings = parse(bindingElement?.textContent ?? &quot;{}&quot;);
    bindingElement?.remove();

    for (const [name, binding] of Object.entries(bindings)) {

    while (pending.length) {

      Object.freeze(object);
      for (const child of Object.values(object)) {

    if (mockElement != null) {
      const mocks = Object.entries(parse(mockElement.textContent));
      mockElement.remove();
      for (const [name, value] of mocks) {
        values.set(name, value);
        updates.push({ name, revision: 1, state: &quot;ready&quot;, value: { type: &quot;json&quot;, value } });
      }
    }
    if (fileElement != null) {
      const files = parse(fileElement.textContent);
      fileElement.remove();
      const blobs = new Map();
      const urls = [];
      for (const [name, binding] of Object.entries(bindings)) {
        if (binding.type !== &quot;file&quot; || !hasOwn(files, binding.path)) continue;

      get bindings() {
        return bindings;

      /** @param {string} name @param {(value: unknown) =&gt; void} callback */
      onData(name, callback) {
        if (typeof callback !== &quot;function&quot;) {
          throw new TypeError(&quot;onData requires a callback&quot;);
        }
        try {
          callback(values.get(name));
        } catch (error) {

          console.error(&quot;Live visualization data callback failed&quot;, error);
        }
        // A static preview delivers the current value once per subscription.
        return () =&gt; {};
      },
    };
  }
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      ...connectorGlobals,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }

    const href = link?.getAttribute(&quot;href&quot;);

      return;
    }

        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }

        target == null ||
        globalThis.navigator.userActivation?.isActive !== true

        return;
      }

        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });

})();

#scanner-cartoons *{box-sizing:border-box}
#scanner-cartoons .atelier-stage{height:716px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:14px 8px}
#scanner-cartoons .phone{width:min(100%,352px);height:604px;position:relative;isolation:isolate;overflow:hidden;border-radius:30px;background:transparent;color:var(--text);container-type:inline-size}
#scanner-cartoons[data-backdrop=photo] .phone{background:var(--cafe-photo) center/cover}
#scanner-cartoons[data-backdrop=photo]{--text:#f1faff}
#scanner-cartoons .phone header{position:absolute;left:22px;right:20px;top:22px;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:5}
#scanner-cartoons h1{font-size:17px;font-weight:500;line-height:1.3;letter-spacing:-.4px;margin:0;color:var(--text)}
#scanner-cartoons .icon-button{width:44px;height:44px;border-radius:50%;border:1px solid light-dark(#60839b66,#d8f2ff66);background:transparent;color:var(--text);display:grid;place-items:center;padding:0;flex:none;font:500 12px &#x27;DM Sans&#x27;,sans-serif}
#scanner-cartoons[data-backdrop=photo] .icon-button{border-color:#eaf8ff88;backdrop-filter:blur(12px)}
#scanner-cartoons .icon-button svg{width:19px!important;height:19px!important;stroke-width:1.6}
#scanner-cartoons .finder{position:absolute;left:16%;width:68%;top:31%;aspect-ratio:1;border:1px solid light-dark(#668ba288,#edfaff99);border-radius:28px;pointer-events:none;transition:transform .5s;z-index:3}
#scanner-cartoons .finder&gt;i{position:absolute;width:29px;height:29px;border:2px solid light-dark(#456f8a,#f0faff);filter:drop-shadow(0 1px 1px #17384c25)}
#scanner-cartoons .finder&gt;i:nth-child(1){top:-1px;left:-1px;border-right:0;border-bottom:0;border-radius:28px 0 0}
#scanner-cartoons .finder&gt;i:nth-child(2){top:-1px;right:-1px;border-left:0;border-bottom:0;border-radius:0 28px 0 0}
#scanner-cartoons .finder&gt;i:nth-child(3){bottom:-1px;left:-1px;border-right:0;border-top:0;border-radius:0 0 0 28px}
#scanner-cartoons .finder&gt;i:nth-child(4){bottom:-1px;right:-1px;border-left:0;border-top:0;border-radius:0 0 28px}
#scanner-cartoons .beam-window{position:absolute;inset:3px;overflow:hidden;border-radius:25px}
#scanner-cartoons .beam{height:25%;opacity:0;background:linear-gradient(transparent,#a6d7ed22 95%,#d1edfa);width:100%}
#scanner-cartoons .placard{position:absolute;top:calc(31% + 30px);left:calc(50% - 68px);width:136px;height:165px;border:1px solid #f5fcff;border-radius:10px;background:linear-gradient(130deg,#f7fbfb,#e4eef3);box-shadow:0 15px 24px #173c5529;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;transform:rotate(-5deg);transition:opacity .4s,filter .4s,transform .4s}
#scanner-cartoons .placard small{font-size:10px;font-weight:500;letter-spacing:1.1px;color:#335970}
#scanner-cartoons .qr{width:94px;height:94px;background:var(--sample-qr) center/contain no-repeat;image-rendering:pixelated}
#scanner-cartoons .placard strong{color:#244c66;font-size:13px;letter-spacing:2px;font-weight:600}
#scanner-cartoons .success{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity .3s}
#scanner-cartoons .success span{width:54px;height:54px;display:grid;place-items:center;background:#e5f5ff;border:1px solid #f5fcff;border-radius:50%;color:#315f7b;box-shadow:0 6px 24px #244a6330;transform:scale(.7);transition:transform .4s}
#scanner-cartoons .success svg{width:25px!important;height:25px!important}
#scanner-cartoons .status{position:absolute;left:50%;top:76%;transform:translate(-50%,6px);z-index:4;padding:10px 16px;min-height:40px;border-radius:24px;border:1px solid #f3fbff;background:#e7f5fff2;color:#274f69;font-size:13px;font-weight:500;white-space:nowrap;opacity:0;transition:opacity .3s,transform .3s}
#scanner-cartoons .phone[data-phase=locking] .status,#scanner-cartoons .phone[data-phase=found] .status{opacity:1;transform:translate(-50%,0)}
#scanner-cartoons .phone[data-phase=found] .finder{transform:scale(.96)}
#scanner-cartoons .phone[data-phase=found] .success{opacity:1}
#scanner-cartoons .phone[data-phase=found] .success span{transform:scale(1)}
#scanner-cartoons .phone[data-phase=found] .placard{opacity:.4;filter:blur(2px)}
#scanner-cartoons .controls{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:14px;z-index:5}
#scanner-cartoons .phone.is-zoomed .placard{transform:rotate(-2deg) scale(1.15)}
#scanner-cartoons .phone.is-lit .placard{filter:brightness(1.15)}
#scanner-cartoons .closed{position:absolute;inset:0;z-index:7;backdrop-filter:blur(25px);background:light-dark(#e2f0f255,#16384d55);display:grid;place-items:center}
#scanner-cartoons .closed[hidden]{display:none}
#scanner-cartoons .play,#scanner-cartoons .reopen{border:1px solid light-dark(#5a819966,#b5d5e766);background:transparent;color:var(--text);font:500 13px &#x27;DM Sans&#x27;,sans-serif;border-radius:24px;padding:12px 22px;min-height:44px}
#scanner-cartoons .play:disabled{opacity:.6}
#scanner-cartoons .layer{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden;perspective:650px;clip-path:polygon(evenodd,0 0,100% 0,100% 100%,0 100%,0 0,13% 28%,13% 75%,87% 75%,87% 28%,13% 28%)}
#scanner-cartoons .prop{position:absolute;display:block;transform-style:preserve-3d;will-change:transform,opacity;transform-origin:center;opacity:.92}
#scanner-cartoons .paper{width:42px;height:52px;background:linear-gradient(120deg,#f2faff,#8ab1cb);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);filter:drop-shadow(0 5px 4px #28516c24)}
#scanner-cartoons .paper::after{content:&#x27;&#x27;;position:absolute;inset:0;background:linear-gradient(90deg,transparent 48%,#476c8b44 50%,transparent 52%),linear-gradient(30deg,transparent 49%,#fff9 50%,transparent 52%)}
#scanner-cartoons .silk{width:20px;height:96px;border:6px solid #a7cee3;border-width:0 6px;border-radius:50%;box-shadow:inset -2px 0 #edfaff,2px 0 #345f8040;transform-origin:50% 0}
