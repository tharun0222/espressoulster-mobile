      nextState == null ||

#greeting-entrance-effects .entrance-stage{height:418px;display:flex;flex-direction:column;align-items:center;gap:14px;padding:12px;box-sizing:border-box}
#greeting-entrance-effects .home-preview{width:100%;max-width:352px;height:344px;box-sizing:border-box;overflow:hidden;padding:22px 20px;color:#17384c;background:linear-gradient(154deg,#a4b9cc 5%,#a9bfd3 44%,#849fb7 100%);border-radius:26px;font-family:EntrancePoppins,Poppins,sans-serif;font-weight:600;box-shadow:0 10px 24px #17384c18}
#greeting-entrance-effects .brand-row{display:flex;align-items:center;gap:10px;height:43px}
#greeting-entrance-effects .brand-logo{height:43px;width:43px;object-fit:contain;border-radius:12px}
#greeting-entrance-effects .brand-name{font-size:15px;line-height:1.3;letter-spacing:-.4px;white-space:nowrap}
#greeting-entrance-effects .greeting{position:relative;isolation:isolate;font-family:EntrancePoppins,Poppins,sans-serif;font-size:22px;font-weight:600;letter-spacing:-.65px;line-height:1.45;margin:24px 0 20px;min-height:96px;color:#17384c;transform-origin:50% 50%;overflow:visible}
#greeting-entrance-effects .greeting-copy{display:block;position:relative}
#greeting-entrance-effects .text-line{display:block;position:relative;white-space:nowrap}
#greeting-entrance-effects .motion-word,#greeting-entrance-effects .motion-char{display:inline-block;transform-origin:50% 90%}
#greeting-entrance-effects .motion-space{white-space:pre}
#greeting-entrance-effects .greeting-decoration{position:absolute;pointer-events:none;opacity:0}
#greeting-entrance-effects .glint{inset:-6px -8px;background:linear-gradient(112deg,transparent 40%,#eff8ff99 48%,transparent 56%);mix-blend-mode:soft-light}
#greeting-entrance-effects .underline{height:2px;width:64px;bottom:-7px;left:0;border-radius:2px;background:#dcecf5}
#greeting-entrance-effects .cafe-card{box-sizing:border-box;padding:16px;border-radius:18px;background:#d8e7f19c;box-shadow:inset 0 1px 0 #f2f8fc99;border:1px solid #e5f0f666;display:flex;align-items:center;gap:12px}
#greeting-entrance-effects .cafe-mark{width:36px;height:36px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:12px;background:#a2bdd0;color:#17384c}
#greeting-entrance-effects .cafe-mark svg{width:20px;height:20px}
#greeting-entrance-effects .cafe-name{font-size:14px;line-height:1.45;margin:0;letter-spacing:-.35px}
#greeting-entrance-effects .cafe-status{font-size:11px;line-height:1.4;color:#365569;margin-top:2px}
#greeting-entrance-effects .preview-control{display:flex;align-items:center;justify-content:center;gap:12px;min-height:36px}
#greeting-entrance-effects .motion-note{font-size:12px;color:var(--muted-foreground);margin:0}
@media(max-width:380px){#greeting-entrance-effects .entrance-stage{padding:10px 0;height:418px}#greeting-entrance-effects .home-preview{padding:22px 16px}#greeting-entrance-effects .greeting{font-size:21px;letter-spacing:-.65px}}
@media(prefers-reduced-motion:reduce){#greeting-entrance-effects .greeting,#greeting-entrance-effects .greeting *{animation:none!important;transition:none!important}}

div&gt;&lt;div class=&quot;brand-name&quot;&gt;Espressoulster Coffee&lt;/div&gt;&lt;/div&gt;&lt;/header&gt;&lt;h1 class=&quot;greeting&quot; aria-label=&quot;Hello, beautiful. Your entrance deserves its own little poem.&quot;&gt;&lt;span class=&quot;greeting-copy&quot; aria-hidden=&quot;true&quot;&gt;&lt;span class=&quot;text-line&quot;&gt;Hello, beautiful.&lt;/span&gt;&lt;span class=&quot;text-line&quot;&gt;Your entrance deserves&lt;/span&gt;&lt;span class=&quot;text-line&quot;&gt;its own little poem.&lt;/span&gt;&lt;/span&gt;&lt;/h1&gt;&lt;div class=&quot;cafe-card&quot;&gt;&lt;span class=&quot;cafe-mark&quot;&gt;&lt;i data-lucide=&quot;map-pin&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;div&gt;&lt;p class=&quot;cafe-name&quot;&gt;Koramangala 4th Block&lt;/p&gt;&lt;p class=&quot;cafe-status&quot;&gt;View café&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;preview-control&quot;&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-replay&gt;Replay&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;greeting-entrance-effects&#x27;);
  if (!root) return;
  const motionPreference = window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;);
  const settings = { pace: 100 };
  const activeAnimations = new Map();
  const defaults = { easing: &#x27;cubic-bezier(.2,.7,.25,1)&#x27;, fill: &#x27;both&#x27; };

  function splitText(greeting, kind) {
    const lines = Array.from(greeting.querySelectorAll(&#x27;.text-line&#x27;));
    lines.forEach(line =&gt; {
      const text = line.textContent;
      const parts = kind === &#x27;char&#x27; ? Array.from(text) : text.split(/(\s+)/);
      line.replaceChildren(...parts.map(part =&gt; {
        const span = document.createElement(&#x27;span&#x27;);
        span.className = /^\s+$/.test(part) ? &#x27;motion-space&#x27; : `motion-${kind}`;
        span.textContent = part;
        return span;
      }));
    });
    return Array.from(greeting.querySelectorAll(`.motion-${kind}`));
  }

  function clearAnimations(section) {
    (activeAnimations.get(section) || []).forEach(animation =&gt; animation.cancel());
    activeAnimations.delete(section);
  }

  function play(section) {
    clearAnimations(section);
    if (motionPreference.matches || typeof Element.prototype.animate !== &#x27;function&#x27;) return;
    const greeting = section.querySelector(&#x27;.greeting&#x27;);
    const copy = greeting.querySelector(&#x27;.greeting-copy&#x27;);
    const lines = Array.from(greeting.querySelectorAll(&#x27;.text-line&#x27;));
    const animations = [];
    const unit = settings.pace / 100;
    function animate(element, frames, duration = 800, delay = 0, easing = defaults.easing) {
      animations.push(element.animate(frames, { ...defaults, duration: duration * unit, delay: delay * unit, easing }));
    }
    const fade = [{ opacity: 0 }, { opacity: 1 }];
    switch (section.dataset.variant) {
      case &#x27;Soft rise&#x27;:
        animate(copy, [{ opacity: 0, transform: &#x27;translateY(14px)&#x27; }, { opacity: 1, transform: &#x27;translateY(0)&#x27; }], 900);
        break;
      case &#x27;Silk lines&#x27;:
        lines.forEach((line, index) =&gt; animate(line, [{ opacity: 0, clipPath: &#x27;inset(100% 0 0 0)&#x27;, transform: &#x27;translateY(7px)&#x27; }, { opacity: 1, clipPath: &#x27;inset(0% 0 0 0)&#x27;, transform: &#x27;translateY(0)&#x27; }], 720, index * 140));
        break;
      case &#x27;Horizon wipe&#x27;:
        animate(copy, [{ clipPath: &#x27;inset(0 100% 0 0)&#x27; }, { clipPath: &#x27;inset(0 0% 0 0)&#x27; }], 1050, 0, &#x27;cubic-bezier(.45,0,.2,1)&#x27;);
        break;
      case &#x27;Dew focus&#x27;:
        animate(copy, [{ opacity: 0, filter: &#x27;blur(9px)&#x27; }, { opacity: .6, filter: &#x27;blur(3px)&#x27;, offset: .45 }, { opacity: 1, filter: &#x27;blur(0)&#x27; }], 1050);
        break;
      case &#x27;Letter cascade&#x27;:
        splitText(greeting, &#x27;char&#x27;).forEach((character, index) =&gt; animate(character, [{ opacity: 0, transform: &#x27;translateY(9px)&#x27; }, { opacity: 1, transform: &#x27;translateY(0)&#x27; }], 420, index * 16));
        break;
      case &#x27;Focus settle&#x27;:
        animate(copy, [{ opacity: 0, transform: &#x27;scale(1.045)&#x27;, filter: &#x27;blur(3px)&#x27; }, { opacity: 1, transform: &#x27;scale(1)&#x27;, filter: &#x27;blur(0)&#x27; }], 1000);
        break;
      case &#x27;Glass glint&#x27;:
        animate(copy, fade, 650);
        animate(greeting.querySelector(&#x27;.glint&#x27;), [{ opacity: 0, transform: &#x27;translateX(-55%)&#x27; }, { opacity: .8, offset: .4 }, { opacity: 0, transform: &#x27;translateX(55%)&#x27; }], 1100, 100, &#x27;ease-in-out&#x27;);
        break;
      case &#x27;Gentle wave&#x27;:
        splitText(greeting, &#x27;char&#x27;).forEach((character, index) =&gt; animate(character, [{ opacity: 0, transform: &#x27;translateY(4px) rotate(-2deg)&#x27; }, { opacity: 1, transform: &#x27;translateY(-2px) rotate(.5deg)&#x27;, offset: .65 }, { opacity: 1, transform: &#x27;translateY(0) rotate(0deg)&#x27; }], 650, index * 10));
        break;
      case &#x27;Word lift&#x27;:
        splitText(greeting, &#x27;word&#x27;).forEach((word, index) =&gt; animate(word, [{ opacity: 0, transform: &#x27;translateY(13px)&#x27; }, { opacity: 1, transform: &#x27;translateY(0)&#x27; }], 600, index * 65));
        break;
      case &#x27;Ink wash&#x27;:
        lines.forEach((line, index) =&gt; animate(line, [{ opacity: 0, filter: &#x27;blur(1px)&#x27;, color: &#x27;#678397&#x27; }, { opacity: 1, filter: &#x27;blur(0)&#x27;, color: &#x27;#17384c&#x27; }], 1050, index * 60, &#x27;ease-in-out&#x27;));
        break;
      case &#x27;Center bloom&#x27;:
        animate(copy, [{ opacity: .3, clipPath: &#x27;circle(0% at 45% 50%)&#x27; }, { opacity: 1, clipPath: &#x27;circle(110% at 45% 50%)&#x27; }], 1100, 0, &#x27;cubic-bezier(.3,.2,.2,1)&#x27;);
        break;
      case &#x27;Quiet drift&#x27;:
        animate(copy, [{ opacity: 0, transform: &#x27;translateX(-14px)&#x27; }, { opacity: 1, transform: &#x27;translateX(0)&#x27; }], 1000);
        break;
      case &#x27;Curtain reveal&#x27;:
        animate(copy, [{ clipPath: &#x27;inset(0 0 100% 0)&#x27;, transform: &#x27;translateY(-4px)&#x27; }, { clipPath: &#x27;inset(0 0 0% 0)&#x27;, transform: &#x27;translateY(0)&#x27; }], 1150, 0, &#x27;cubic-bezier(.35,.1,.2,1)&#x27;);
        break;
      case &#x27;Poetic cadence&#x27;:
        lines.forEach((line, index) =&gt; animate(line, [{ opacity: 0, transform: &#x27;translateY(5px)&#x27; }, { opacity: 1, transform: &#x27;translateY(0)&#x27; }], 700, [0,300,600][index]));
        break;
      case &#x27;Paper tilt&#x27;:
        lines.forEach((line, index) =&gt; animate(line, [{ opacity: 0, transform: &#x27;perspective(500px) rotateX(-24deg) translateY(6px)&#x27; }, { opacity: 1, transform: &#x27;perspective(500px) rotateX(0deg) translateY(0)&#x27; }], 820, index * 100));
        break;
      case &#x27;Tracking settle&#x27;:
        animate(copy, [{ opacity: 0, letterSpacing: &#x27;-1.75px&#x27; }, { opacity: 1, letterSpacing: &#x27;-.65px&#x27; }], 1150);
        break;
      case &#x27;Signature line&#x27;:
        animate(copy, fade, 850);
        animate(greeting.querySelector(&#x27;.underline&#x27;), [{ opacity: 0, transform: &#x27;scaleX(0)&#x27;, transformOrigin: &#x27;left&#x27; }, { opacity: .8, transform: &#x27;scaleX(1)&#x27;, offset: .55 }, { opacity: 0, transform: &#x27;scaleX(1)&#x27; }], 1300, 100);
        break;
      case &#x27;Split balance&#x27;:
        lines.forEach((line, index) =&gt; animate(line, [{ opacity: 0, transform: `translateX(${index % 2 ? 11 : -11}px)` }, { opacity: 1, transform: &#x27;translateX(0)&#x27; }], 900, index * 80));
        break;
      case &#x27;Velvet dissolve&#x27;:
        splitText(greeting, &#x27;word&#x27;).forEach((word, index) =&gt; animate(word, [{ opacity: 0, filter: &#x27;blur(5px)&#x27; }, { opacity: 1, filter: &#x27;blur(0)&#x27; }], 850, ((index * 3) % 5) * 75));
        break;
      case &#x27;Breath in&#x27;:
        animate(copy, [{ opacity: 0, transform: &#x27;scale(.965)&#x27; }, { opacity: 1, transform: &#x27;scale(1)&#x27; }], 1300, 0, &#x27;cubic-bezier(.16,.6,.3,1)&#x27;);
        break;
    }
    activeAnimations.set(section, animations);
    Promise.allSettled(animations.map(animation =&gt; animation.finished)).then(() =&gt; {
      if (activeAnimations.get(section) === animations) clearAnimations(section);
    });
  }

  root.querySelectorAll(&#x27;[data-replay]&#x27;).forEach(button =&gt; {
    button.addEventListener(&#x27;click&#x27;, () =&gt; play(button.closest(&#x27;section[data-variant]&#x27;)));
  });
  function updateMotionPreference() {
    if (motionPreference.matches) root.querySelectorAll(&#x27;section[data-variant]&#x27;).forEach(clearAnimations);
    root.querySelectorAll(&#x27;[data-replay]&#x27;).forEach(button =&gt; {
      button.textContent = motionPreference.matches ? &#x27;Reduced motion&#x27; : &#x27;Replay&#x27;;
      button.disabled = motionPreference.matches;
    });
  }
  updateMotionPreference();
  motionPreference.addEventListener(&#x27;change&#x27;, updateMotionPreference);
  if (globalThis.Tweak) {
    const tweak = new Tweak({ container: root, onChange: () =&gt; {} });
    tweak.addSlider(settings, &#x27;pace&#x27;, { label: &#x27;Timing scale&#x27;, min: 60, max: 160, step: 10, unit: &#x27;%&#x27; });
  }
})();
&lt;/script&gt;

&lt;script&gt;
(() =&gt; {
  let positioningReady = window.FloatingUIDOM
    ? Promise.resolve(window.FloatingUIDOM)
    : null;
  const loadScript = (src) =&gt; new Promise((resolve, reject) =&gt; {
    const script = document.createElement(&quot;script&quot;);
    script.src = src;
    script.onload = resolve;

      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = { modelContent: null, privateContent: null, ...state };
    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;
  };
  let storage = null;
  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const persistSize = () => {
    globalThis.clearTimeout(sizeWriteTimeout);
    if (pendingSize == null) {
      return;
    }
    try {
      storage?.setItem(sizeStorageKey, pendingSize);
    } catch {
      // A denied or full cache must not affect the visualization.
    }
    pendingSize = null;
  };
  if (isShare) {
    globalThis.addEventListener("pagehide", persistSize);
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height !== "number" ||
        !Number.isFinite(height) ||
        height < 0
      ) {
        return;
      }
      if (height <= 10_000) {
        const width = isShare && storage != null ? frame.clientWidth : null;
        frame.style.height = Math.ceil(height) + "px";
        if (isShare && storage != null) {
          const size = JSON.stringify({
            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,
            scale: globalThis.devicePixelRatio,
            height: Math.ceil(height),
          });
          if (size !== lastSize) {
            lastSize = size;
            pendingSize = size;
            globalThis.clearTimeout(sizeWriteTimeout);
            sizeWriteTimeout = globalThis.setTimeout(persistSize, 100);
          }
        }
      }
      if (isShare) {
        // Keep unusually tall content accessible without accepting an unbounded height.
        if (height > 10_000 && Number.parseFloat(frame.style.height) === 0) {
          frame.style.removeProperty("height");
        }
        frame.scrolling = height > 10_000 ? "auto" : "no";
        document.documentElement.classList.add("visualization-share-ready");
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
</script>
</body>
