<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espressoulster · Copper E</title>
<style>
html { background: #160f0d; color-scheme: dark; }
body { margin: 0; min-height: 100svh; display: grid; place-items: center;
  background: radial-gradient(ellipse at 50% 48%, #352119, #160f0d 65%); }
svg { width: min(62vw, 230px); height: auto; overflow: visible; }
.stroke { fill: url(#copper); transform-box: fill-box; transform-origin: left center;
  animation: turn 680ms var(--delay) cubic-bezier(.2,.75,.25,1) both; }
.shine { animation: sweep 500ms 940ms ease-out both; }
@keyframes turn {
  from { opacity: 0; transform: perspective(180px) rotateY(-78deg) rotateZ(var(--angle)) translateX(18px); }
  to { opacity: 1; transform: none; }
}
@keyframes sweep {
  from { transform: translateX(-125px); }
  to { transform: translateX(125px); }
}
@media (prefers-reduced-motion: reduce) {
  .stroke { animation: none; }
  .shine { display: none; }
}
</style>
<svg viewBox="0 0 180 180" role="img" aria-label="Espressoulster copper E">
 <defs>
  <linearGradient id="copper" x2="1" y2="1" gradientUnits="objectBoundingBox">
   <stop stop-color="#f8c69d"/><stop offset=".53" stop-color="#cd855e"/><stop offset="1" stop-color="#a95b39"/>
  </linearGradient>
  <linearGradient id="light">
   <stop stop-color="#fff2db" stop-opacity="0"/><stop offset=".5" stop-color="#fff2db" stop-opacity=".62"/><stop offset="1" stop-color="#fff2db" stop-opacity="0"/>
  </linearGradient>
  <path id="top" d="M44 38H139L126 57H63V73H44Z"/>
  <path id="middle" d="M44 73H63V82H122L109 101H63V111H44Z"/>
  <path id="bottom" d="M44 111H63V125H139L126 144H44Z"/>

 </defs>
 <use class="stroke" href="#top" style="--delay:80ms;--angle:-17deg"/>
 <use class="stroke" href="#middle" style="--delay:165ms;--angle:13deg"/>
 <use class="stroke" href="#bottom" style="--delay:250ms;--angle:22deg"/>
 <g clip-path="url(#letter)"><path class="shine" d="M63 22H98L119 158H84Z" fill="url(#light)"/></g>
</svg>
