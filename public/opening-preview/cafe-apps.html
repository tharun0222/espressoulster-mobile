const picker = document.querySelector('#cafes');
const screens = document.querySelector('#screens');
const prev = document.querySelector('#prev');
const next = document.querySelector('#next');
const number = index => String(index + 1).padStart(2, '0');
apps.forEach(({name}, index) => picker.add(new Option(number(index) + ' · ' + name, index)));
function show(index) {
  const app = apps[index];
  picker.value = index;
  document.querySelector('#title').textContent = number(index) + ' · ' + app.name;
  document.querySelector('#source').href = app.url;
  const images = app.images.map((url, i) => {
    const image = new Image();
    image.alt = app.name + ' App Store screenshot ' + (i + 1);
    image.loading = i ? 'lazy' : 'eager';
    image.src = url;
    return image;
  });
  screens.replaceChildren(...images);
  screens.scrollLeft = 0;
  prev.disabled = index === 0;
  next.disabled = index === apps.length - 1;
}
picker.addEventListener('change', () => show(Number(picker.value)));
prev.addEventListener('click', () => show(Number(picker.value) - 1));
next.addEventListener('click', () => show(Number(picker.value) + 1));
show(0);
</script>
