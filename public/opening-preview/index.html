<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espressoulster · Logo preview</title>
<style>
body{margin:0;min-height:100svh;display:grid;place-items:center;background:#fffaf5;color:#2b211c;font-family:system-ui,sans-serif;text-align:center}
.logo{font-size:clamp(26px,8vw,42px);font-weight:750;letter-spacing:-.055em;}
.logo span{display:block;margin-top:6px;font-size:11px;letter-spacing:.27em;color:#9b3d1f}
button{margin-top:30px;border:1px solid #e7dcd0;border-radius:999px;padding:10px 18px;background:white;color:inherit;font:inherit;cursor:pointer}
main{width:min(94vw,560px)}
.stage{min-height:170px;display:grid;place-items:center;overflow:hidden;border-radius:24px;background:#fff;border:1px solid #e7dcd0}
#caption{font-weight:700;color:#9b3d1f}
label{display:block;margin:20px 0}
select{font:inherit;padding:8px;border:1px solid #e7dcd0;border-radius:8px;background:white;color:inherit}
button{margin-top:12px}
@media(prefers-reduced-motion:reduce){.logo{animation:none}}
</style>
</head>
<body>
<main>
  <p id="caption" aria-live="polite"></p>
  <div class="stage">
  <div class="logo">Espressoulster<span>COFFEE</span></div>
  </div>
  <button id="prev" type="button">← Previous</button>
  <button id="replay" type="button">Replay animation</button>
  <button id="next" type="button">Next →</button>
  <label>Choose a preview <select id="choices"></select></label>
</main>
<script src="./logo-gallery.js" defer></script>
</body>
</html>
