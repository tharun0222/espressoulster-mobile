<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Refresh Lab · Espressoulster</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7efe7;color:#291914;font:16px system-ui,sans-serif}main{max-width:1150px;margin:auto;padding:28px 16px 60px}.eyebrow{color:#9c442e;font-size:12px;letter-spacing:.2em;font-weight:800}h1{font-size:clamp(42px,9vw,90px);letter-spacing:-.08em;line-height:1;margin:12px 0}p{color:#654940}button,select{font:inherit}button{cursor:pointer}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}nav button,.action,select{background:white;color:#291914;border:1px solid #e1cbbd;border-radius:99px;padding:8px 13px}button[aria-pressed=true],.action{background:#291914;color:#fff}.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,410px);gap:20px;padding:18px;background:#fffaf5;border:1px solid #e1cbbd;border-radius:28px}.screen{position:relative;overflow:hidden;border-radius:20px;background:#2b1814;height:290px;touch-action:none;user-select:none;cursor:grab}.screen:active{cursor:grabbing}canvas{display:block;width:100%;height:100%}.mock{position:absolute;inset:0 0 auto;height:290px;background:#fff5e9;padding:24px;pointer-events:none;border-radius:0 0 18px 18px;box-shadow:0 4px 14px #0003}.mock small{font-weight:800;color:#9c442e;letter-spacing:.12em}.mock strong{display:block;font-size:38px;line-height:1.02;margin:14px 0;letter-spacing:-.06em}.pill{pointer-events:auto;border:0;display:inline-block;background:#bb4d2e;color:#fff;padding:8px 13px;border-radius:20px;font-size:13px}.tools{display:flex;flex-wrap:wrap;gap:8px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}.card{border-radius:15px;overflow:hidden;border:1px solid #e1cbbd;text-align:left;padding:0;background:#fffaf5;color:inherit}.card canvas{height:82px}.card span{display:block;padding:8px;font-size:13px;font-weight:700}.card[aria-pressed=true]{outline:3px solid #bb4d2e;background:#fffaf5;color:inherit}h2{margin:8px 0;font-size:30px;letter-spacing:-.04em}#status{min-height:24px}button:focus-visible,select:focus-visible{outline:3px solid #bb4d2e;outline-offset:3px}@media(max-width:640px){.stage{grid-template-columns:1fr;padding:12px}.screen{height:245px}.mock{height:245px}}
</style></head><body><main>
<div class="eyebrow">ESPRESSOULSTER / INTERACTION STUDIES</div><h1>Refresh Lab.</h1>
<p>Use Next to watch the 50 animations one by one. Swipe down on the sample screen to try the gesture yourself.</p>
<section class="stage" aria-label="Interactive preview"><div><div class="eyebrow" id="number"></div><h2 id="name"></h2><p id="description"></p><div class="tools"><button id="previous" class="action">← Previous</button><button id="next" class="action">Next →</button><button id="play" class="action">Play demo</button><button id="favorite" class="action" aria-pressed="false">☆ Shortlist</button><select id="jump" aria-label="Jump to a concept"></select></div><p id="status" role="status">Swipe down to preview</p></div><div class="screen" id="screen"><canvas id="art" aria-hidden="true"></canvas><div class="mock" id="mock"><small>ESPRESSOULSTER COFFEE</small><strong>Good things<br>are brewing.</strong><button class="pill" id="screen-play">▶ Play animation</button><div style="margin-top:10px;color:#654940;font-size:13px">Or swipe down anywhere on this card ↓</div></div></div></section>
<nav id="filters" aria-label="Filter concepts"></nav><div class="grid" id="grid"></div>
</main><script type="module" src="./lab.js"></script></body></html>
