# Install this dedicated vhost first, then issue its TLS certificate.
server {
    listen 80;
    listen [::]:80;
    server_name espressoulster.37-27-51-7.nip.io;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/espressoulster-acme;
        default_type text/plain;
    }
    location / { return 503; }
}
