# Replace ONLY Espressoulster's HTTP vhost with this after certificate issuance.
server {
    listen 80;
    listen [::]:80;
    server_name espressoulster.37-27-51-7.nip.io;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/espressoulster-acme;
        default_type text/plain;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name espressoulster.37-27-51-7.nip.io;
    ssl_certificate /etc/letsencrypt/live/espressoulster.37-27-51-7.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/espressoulster.37-27-51-7.nip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 12m;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml;
    # Avoid storing phone numbers, payment parameters, OTPs or query strings.
    access_log off;
    error_log /var/log/nginx/espressoulster-staging.error.log warn;
    location / {
        proxy_pass http://127.0.0.1:5175;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
